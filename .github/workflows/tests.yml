name: reconstruction tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[ml,test]'
      - run: pytest -q
      - run: fieldlab --size 12 --ml-steps 20 --output results/ci
      - uses: actions/upload-artifact@v4
        with:
          name: reconstruction-report
          path: results/ci/
