[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "field-reconstruction-lab"
version = "0.1.0"
description = "From pixels and sensor geometry to physical-field reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.9", "scikit-image>=0.22"]
[project.optional-dependencies]
ml = ["torch>=2.2"]
teaching = ["jupyter", "nbformat"]
test = ["pytest>=8"]
[project.scripts]
fieldlab = "fieldlab.cli:main"
[tool.setuptools.packages.find]
include = ["fieldlab*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
